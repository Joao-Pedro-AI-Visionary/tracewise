[workspace]
members = [
    "crates/domain",
    "crates/contracts",
    "crates/web",
    "crates/js",
    "crates/server",
    "crates/cli",
    "crates/proc-supervisor",
    "crates/device",
    "crates/managed",
    "crates/android",
    "crates/native",
    "crates/engines",
]
exclude = ["vendor/oxc_parser"]
resolver = "2"

[patch.crates-io]
# oxc_parser 0.75.0 plus a recursion-depth guard (vendor/oxc_parser/TRACEWISE_PATCH.md).
oxc_parser = { path = "vendor/oxc_parser" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Joao Rocha"]
repository = "https://github.com/Joao-Pedro-AI-Visionary/tracewise"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_jcs = "0.2.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "=0.11.0", features = ["server", "transport-io"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
url = "2.5"
base64 = "0.22"
sourcemap = "9.3.2"
image = { version = "0.25", default-features = false, features = ["png"] }
jsonschema = "0.29"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
minijinja = { version = "=2.24.0", default-features = false, features = ["builtins", "json", "serde"] }
